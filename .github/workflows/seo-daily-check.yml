name: SEO Daily Health Check

# Spec #4 H7 (#240) - daily SEO health check.
# Runs nightly at 03:00 IST (21:30 UTC the previous day). Posts a digest
# to the SEO_HEALTH_WEBHOOK Slack/Discord/email-relay endpoint.

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run SEO daily check on prod server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 103.83.37.54
          username: deploy
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            export PATH="$HOME/.bun/bin:$PATH"
            cd /home/deploy/app
            DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            SEO_HEALTH_WEBHOOK="${{ secrets.SEO_HEALTH_WEBHOOK }}" \
            bun packages/db/scripts/seo-daily-check.ts
