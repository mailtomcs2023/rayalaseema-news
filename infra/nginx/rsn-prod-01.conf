# Rayalaseema News - production nginx for rsn-prod-01 (Medha Proxmox, Nov 2026).
# Install: /etc/nginx/sites-available/rsn-prod-01 -> symlink into sites-enabled,
# then delete /etc/nginx/conf.d/00-rsn-maintenance.conf (go-live).
# Certs: Let's Encrypt via HTTP-01 (webroot /var/www/letsencrypt), names
#   rayalaseemanews / rayalaseemaexpress-com / rayalaseemaexpress-in.
# Origin only accepts Cloudflare IPs (ufw + Proxmox firewall); the realip
# snippet restores the real visitor IP for logs and rate limits.

include /etc/nginx/snippets/cloudflare-realip.conf;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

limit_req_zone $binary_remote_addr zone=rsn_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=rsn_login:10m rate=10r/m;

# --- :80 - ACME challenges + redirect everything to https -------------------
server {
    listen 80 default_server; listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

# --- catch-all :443 for unknown hosts -----------------------------------------
server {
    listen 443 ssl http2 default_server; listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/ssl/rsn/selfsigned.pem; ssl_certificate_key /etc/ssl/rsn/origin.key;
    return 444;
}

# --- www -> apex ---------------------------------------------------------------
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name www.rayalaseemanews.com;
    ssl_certificate /etc/letsencrypt/live/rayalaseemanews/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/rayalaseemanews/privkey.pem;
    return 301 https://rayalaseemanews.com$request_uri;
}

# --- public site + e-paper (web app :3000) -------------------------------------
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name rayalaseemanews.com epaper.rayalaseemanews.com;
    ssl_certificate /etc/letsencrypt/live/rayalaseemanews/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/rayalaseemanews/privkey.pem;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=rsn_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/rsn-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/rsn-proxy-headers.conf;
    }
}

# --- admin CMS (admin app :3001) -----------------------------------------------
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name admin.rayalaseemanews.com;
    ssl_certificate /etc/letsencrypt/live/rayalaseemanews/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/rayalaseemanews/privkey.pem;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }

    location = /api/auth/callback/credentials {
        limit_req zone=rsn_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/rsn-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/rsn-proxy-headers.conf;
        proxy_read_timeout 180s;
    }
}

# --- legacy domains: 301 to the new brand --------------------------------------
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name rayalaseemaexpress.com www.rayalaseemaexpress.com;
    ssl_certificate /etc/letsencrypt/live/rayalaseemaexpress-com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/rayalaseemaexpress-com/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://rayalaseemanews.com$request_uri; }
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name admin.rayalaseemaexpress.com;
    ssl_certificate /etc/letsencrypt/live/rayalaseemaexpress-com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/rayalaseemaexpress-com/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://admin.rayalaseemanews.com$request_uri; }
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name rayalaseemaexpress.in www.rayalaseemaexpress.in;
    ssl_certificate /etc/letsencrypt/live/rayalaseemaexpress-in/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/rayalaseemaexpress-in/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://rayalaseemanews.com$request_uri; }
}
